[pytest]
markers =
    llm: tests that call a real LLM (need .env)
    shuffled_slots: tests that use the real per-day shuffle of con call slots
    full_days: tests where a short con plan is filled up to five calls
    special_moves: hard tests that schedule the special cons (echo, decoy + investigator, forged memo)
addopts = -m "not llm"
pythonpath = .
