<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front Desk</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="banner" class="banner" hidden></div>
<div id="toast" class="toast" role="alert" hidden></div>

<!-- Start page -->
<main id="start-screen" class="screen" hidden>
  <div class="start-card">
    <h1 id="start-title">FRONT DESK</h1>
    <div id="start-lines" class="start-lines"></div>
    <form id="start-form">
      <label>Your name <input id="name-input" maxlength="30" value="Jordan" autocomplete="off"></label>
      <fieldset class="difficulty">
        <legend id="difficulty-label">Difficulty</legend>
        <label><input type="radio" name="difficulty" value="easy"> Easy</label>
        <label><input type="radio" name="difficulty" value="normal" checked> Normal</label>
        <label><input type="radio" name="difficulty" value="hard"> Hard</label>
      </fieldset>
      <button id="start-button" class="primary" type="submit">Start your shift</button>
    </form>
    <p id="start-footer" class="fine-print"></p>
  </div>
</main>

<!-- Game -->
<div id="game-screen" hidden>
  <header class="topbar">
    <span class="logo">FRONT DESK</span>
    <span id="top-clock" class="clock"></span>
    <span class="spacer"></span>
    <span id="top-security" title="Security">🛡 Security <b></b></span>
    <span id="top-service" title="Service">🙂 Service <b></b></span>
    <span id="top-player" class="player"></span>
  </header>
  <div class="layout">
    <section id="left" class="panel main-panel" aria-live="polite"></section>
    <aside class="panel side-panel">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="directory" role="tab">Directory</button>
        <button class="tab" data-tab="desk" role="tab">Desk</button>
        <button class="tab" data-tab="policy" role="tab">Policy</button>
        <button class="tab" data-tab="notes" role="tab">My notes</button>
      </div>
      <div id="tab-directory" class="tab-body"></div>
      <div id="tab-desk" class="tab-body" hidden></div>
      <div id="tab-policy" class="tab-body" hidden></div>
      <div id="tab-notes" class="tab-body" hidden>
        <textarea id="my-notes" placeholder="Write your own notes here…"></textarea>
        <p class="fine-print">Kept only in this page's memory — refreshing the page clears it.</p>
      </div>
    </aside>
  </div>
</div>

<!-- End page -->
<main id="end-screen" class="screen end" hidden></main>

<script src="/static/app.js"></script>
</body>
</html>
